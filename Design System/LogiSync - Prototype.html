<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<title>LogiSync — Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="tokens.css"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="screens/shared.jsx"></script>
<script type="text/babel" src="screens/dashboard.jsx"></script>
<script type="text/babel" src="screens/delivery.jsx"></script>
<script type="text/babel" src="screens/sync.jsx"></script>
<script type="text/babel" src="screens/stockist.jsx"></script>

<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: "Geist", system-ui, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "palette": "voltage",
  "dark": true,
  "connection": "online",
  "font": "geist"
}/*EDITMODE-END*/;

const FONT_STACKS = {
  geist:    { display: '"Geist","Space Grotesk",system-ui,sans-serif',           body: '"Geist",system-ui,sans-serif',           mono: '"Geist Mono",ui-monospace,monospace' },
  inter:    { display: '"Space Grotesk",system-ui,sans-serif',                   body: '"Inter",system-ui,sans-serif',           mono: '"JetBrains Mono",ui-monospace,monospace' },
  sohne:    { display: '"Manrope",system-ui,sans-serif',                         body: '"Manrope",system-ui,sans-serif',         mono: '"IBM Plex Mono",ui-monospace,monospace' },
  serif:    { display: '"Fraunces","Iowan Old Style",serif',                     body: '"Geist",system-ui,sans-serif',           mono: '"Geist Mono",ui-monospace,monospace' },
};

function ScreenWrap({ children, palette, dark, connState }) {
  // Cada artboard precebe os tokens do tweak (palette/dark) via data-attrs.
  return (
    <div data-palette={palette} data-theme={dark ? "dark" : "light"}
      style={{ width: SCREEN_W, height: SCREEN_H, position:"relative", overflow:"hidden",
        background: "var(--ls-bg)",
        ...(window.__LS_FONTS && {
          ["--ls-font-display"]: window.__LS_FONTS.display,
          ["--ls-font-body"]: window.__LS_FONTS.body,
          ["--ls-font-mono"]: window.__LS_FONTS.mono,
        }),
      }}>
      {React.cloneElement(children, { connState, queue: connState === "online" ? 0 : connState === "syncing" ? 3 : 4 })}
    </div>
  );
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Aplicar fonte selecionada globalmente via CSS vars no <html>
  React.useEffect(() => {
    const f = FONT_STACKS[t.font] || FONT_STACKS.geist;
    window.__LS_FONTS = f;
    document.documentElement.style.setProperty("--ls-font-display", f.display);
    document.documentElement.style.setProperty("--ls-font-body",    f.body);
    document.documentElement.style.setProperty("--ls-font-mono",    f.mono);
  }, [t.font]);

  // Carregar fontes adicionais sob demanda
  React.useEffect(() => {
    const url = {
      inter:  "https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap",
      sohne:  "https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap",
      serif:  "https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap",
    }[t.font];
    if (!url || document.querySelector(`link[data-f="${t.font}"]`)) return;
    const l = document.createElement("link");
    l.rel = "stylesheet"; l.href = url; l.dataset.f = t.font;
    document.head.appendChild(l);
  }, [t.font]);

  const wrap = (Component) => (
    <ScreenWrap palette={t.palette} dark={t.dark} connState={t.connection}>
      <Component />
    </ScreenWrap>
  );

  return (
    <>
      <DesignCanvas>
        <DCSection id="brand" title="LogiSync" subtitle="Sistema de design para mobilidade logística · v0.1">
          <DCArtboard id="cover" label="Cover" width={760} height={SCREEN_H}>
            <CoverArtboard palette={t.palette} dark={t.dark}/>
          </DCArtboard>
        </DCSection>

        <DCSection id="dashboard" title="Dashboard do Entregador (A Rota)" subtitle="3 variações de layout — cards · lista densa · timeline">
          <DCArtboard id="d-cards"    label="A · Cards (peso visual no próximo)"  width={SCREEN_W} height={SCREEN_H}>{wrap(DashboardCards)}</DCArtboard>
          <DCArtboard id="d-list"     label="B · Lista densa + filtros"            width={SCREEN_W} height={SCREEN_H}>{wrap(DashboardList)}</DCArtboard>
          <DCArtboard id="d-timeline" label="C · Timeline horária"                 width={SCREEN_W} height={SCREEN_H}>{wrap(DashboardTimeline)}</DCArtboard>
        </DCSection>

        <DCSection id="delivery" title="Tela de Ação (Baixa da Entrega)" subtitle="3 mecânicas anti-erro para o ato de confirmar">
          <DCArtboard id="del-swipe"  label="A · Swipe to confirm"        width={SCREEN_W} height={SCREEN_H}>{wrap(DeliverySwipe)}</DCArtboard>
          <DCArtboard id="del-hold"   label="B · Hold to confirm (2s)"    width={SCREEN_W} height={SCREEN_H}>{wrap(DeliveryHold)}</DCArtboard>
          <DCArtboard id="del-double" label="C · Double-tap armado"       width={SCREEN_W} height={SCREEN_H}>{wrap(DeliveryDoubleTap)}</DCArtboard>
        </DCSection>

        <DCSection id="sync" title="Fila de Sincronização (Coração Offline)" subtitle="Linguagem visual de cache local e progresso quando o sinal volta">
          <DCArtboard id="sync-list"     label="A · Lista cronológica"  width={SCREEN_W} height={SCREEN_H}>{wrap(SyncQueueList)}</DCArtboard>
          <DCArtboard id="sync-blocks"   label="B · Blocks + progresso" width={SCREEN_W} height={SCREEN_H}>{wrap(SyncQueueBlocks)}</DCArtboard>
          <DCArtboard id="sync-timeline" label="C · Timeline por status"width={SCREEN_W} height={SCREEN_H}>{wrap(SyncQueueTimeline)}</DCArtboard>
        </DCSection>

        <DCSection id="stockist" title="Modo Estoquista" subtitle="Mesmo design system, contexto de armazém — sash âmbar marca o modo">
          <DCArtboard id="stk-main" label="Recebimento · Doca 4" width={SCREEN_W} height={SCREEN_H}>{wrap(StockistMode)}</DCArtboard>
        </DCSection>

        <DCSection id="notes" title="Notas de design" subtitle="Por que estas decisões — para a banca de TI">
          <DCArtboard id="notes-1" label="Justificativas" width={520} height={620}>
            <NotesCard/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="LogiSync · Tweaks">
        <TweakSection label="Tema">
          <TweakToggle label="Modo escuro (CD/noturno)" value={t.dark} onChange={(v)=>setTweak("dark", v)} />
        </TweakSection>

        <TweakSection label="Conexão (simular)">
          <TweakRadio label="Estado" value={t.connection}
            options={[
              { value: "online",  label: "Online"  },
              { value: "syncing", label: "Sync"    },
              { value: "offline", label: "Offline" },
            ]}
            onChange={(v)=>setTweak("connection", v)} />
        </TweakSection>

        <TweakSection label="Tipografia">
          <TweakSelect label="Fonte" value={t.font}
            options={[
              { value: "geist", label: "Geist (default)" },
              { value: "inter", label: "Inter + Space Grotesk" },
              { value: "sohne", label: "Manrope + Plex Mono" },
              { value: "serif", label: "Display Serif (Fraunces)" },
            ]}
            onChange={(v)=>setTweak("font", v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

// ─── Cover artboard ─────────────────────────────────────────────
function CoverArtboard({ palette, dark }) {
  return (
    <div data-palette={palette} data-theme={dark ? "dark" : "light"} style={{
      width: "100%", height: "100%",
      background: "var(--ls-bg)", color:"var(--ls-ink)",
      padding: "48px 48px 36px", display:"flex", flexDirection:"column", justifyContent:"space-between",
      position:"relative", overflow:"hidden",
      fontFamily: "var(--ls-font-body)",
    }}>
      <div className="ls-dotgrid" style={{ position:"absolute", inset: 0, opacity: 0.25, pointerEvents:"none" }}/>
      <div style={{ position:"relative" }}>
        <div style={{ display:"flex", alignItems:"center", gap: 10 }}>
          <div style={{ width: 28, height: 28, borderRadius: 7, background:"var(--ls-ink)",
            display:"flex", alignItems:"center", justifyContent:"center" }}>
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M2 5l6-3 6 3v6l-6 3-6-3V5z" stroke="var(--ls-accent)" strokeWidth="1.4"/>
              <path d="M2 5l6 3 6-3M8 8v6" stroke="var(--ls-accent)" strokeWidth="1.4"/>
            </svg>
          </div>
          <div className="ls-mono" style={{ fontSize: 13, fontWeight: 600, letterSpacing: 0.04 }}>LOGISYNC</div>
          <span style={{ width: 4, height: 4, borderRadius: 2, background:"var(--ls-ink-4)" }}/>
          <div className="ls-mono" style={{ fontSize: 12, color:"var(--ls-ink-3)" }}>v0.1 / mai 2026</div>
        </div>

        <div className="ls-display-xl" style={{ fontSize: 68, lineHeight: 1, marginTop: 80, maxWidth: 600, letterSpacing: -0.035 }}>
          Logística<br/>de trincheira<br/>com estética <span style={{ background:"var(--ls-accent)", padding:"0 8px" }}>premium</span>.
        </div>

        <div style={{ marginTop: 28, fontSize: 16, lineHeight: 1.5, maxWidth: 480, color:"var(--ls-ink-2)" }}>
          Sistema de design para um app de mobilidade corporativa <em>offline-first</em>. Cores funcionais com alto contraste para leitura sob sol, hit-areas generosas para uso com luvas, e linguagem visual clara para estados de conexão.
        </div>
      </div>

      <div style={{ position:"relative", display:"flex", gap: 24, alignItems:"flex-end", flexWrap:"wrap" }}>
        <Stat n="3"  l="layouts de rota"/>
        <Stat n="3"  l="mecânicas de confirmar"/>
        <Stat n="3"  l="visões de fila offline"/>
        <Stat n="1"  l="modo estoquista"/>
        <div style={{ flex: 1 }}/>
        <div className="ls-mono" style={{ fontSize: 11, color:"var(--ls-ink-4)", textAlign:"right", maxWidth: 220 }}>
          Use o toolbar à direita para alternar paleta, modo escuro, estado de conexão e tipografia em tempo real.
        </div>
      </div>
    </div>
  );
}
function Stat({ n, l }) {
  return (
    <div>
      <div style={{ fontFamily:"var(--ls-font-display)", fontSize: 38, fontWeight: 600, letterSpacing: -0.025, lineHeight: 1 }}>{n}</div>
      <div className="ls-overline" style={{ marginTop: 4 }}>{l}</div>
    </div>
  );
}

// ─── Notes card ─────────────────────────────────────────────────
function NotesCard() {
  return (
    <div style={{ padding: 28, height:"100%", overflowY:"auto",
      background:"var(--ls-surface)", fontFamily: 'var(--ls-font-body)', color:"var(--ls-ink)" }}>
      <div className="ls-overline">Decisões de design</div>
      <div className="ls-display-md" style={{ marginTop: 6, marginBottom: 18 }}>Por que assim</div>

      <Note n="01" t="Flat-base, glass só em modais">
        Telas vistas sob sol direto não suportam blur ou translucidez como UI primária. Glassmorphism fica reservado para overlays (bottom-sheets, modais de confirmação) onde o contexto fica congelado — não compromete leitura nem performance.
      </Note>
      <Note n="02" t="Geist (Vercel) + Geist Mono">
        Display moderno, neutro, com altura-x generosa. Mono para tudo que é técnico (códigos, IDs, tempos, ETAs) — sinaliza ao entregador "isto é um dado de sistema, confie".
      </Note>
      <Note n="03" t="Hit areas ≥ 56-72px">
        CTA principal = 72px. Botões secundários = 56px. Pensado para uso com luvas e em superfícies trêmulas (caminhão em movimento).
      </Note>
      <Note n="04" t="Confirmação à prova de erro">
        Tap simples não confirma entregas. Oferecemos 3 alternativas — swipe (mais comum, ergonômico), hold (mais seguro), double-tap armado (mais rápido para entregadores experientes). A escolha pode ser por perfil.
      </Note>
      <Note n="05" t="Linguagem do offline">
        Itens em cache local usam <em>borda tracejada</em> + selo monospace + cor "offline" neutra (não vermelho — offline não é erro, é estado de trabalho). Itens em trânsito ganham hatch listrado e ring animado. Itens sincronizados desbotam visualmente (alpha 55%) para sair da atenção.
      </Note>
    </div>
  );
}
function Note({ n, t, children }) {
  return (
    <div style={{ display:"flex", gap: 16, paddingBottom: 16, marginBottom: 16, borderBottom: "0.5px solid var(--ls-line)" }}>
      <div className="ls-mono" style={{ fontSize: 11, fontWeight: 600, color:"var(--ls-ink-4)", paddingTop: 2, minWidth: 22 }}>{n}</div>
      <div>
        <div style={{ fontSize: 14, fontWeight: 600 }}>{t}</div>
        <div style={{ fontSize: 12.5, color:"var(--ls-ink-3)", marginTop: 4, lineHeight: 1.5 }}>{children}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
